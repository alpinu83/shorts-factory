name: collect-news

# 조회수 높은 정치 뉴스 후보를 모아 CEO Hub로 보냄 (한국 시간 아침 7시·저녁 6시)
on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect and send candidates
        env:
          HUB_URL: https://ai-ceo-hub.onrender.com
          SHORTS_HOOK_TOKEN: ${{ secrets.SHORTS_HOOK_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          BATCH: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: python3 scripts/collect_news.py
