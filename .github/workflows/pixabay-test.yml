name: pixabay-test

on:
  workflow_dispatch:
    inputs:
      query:
        description: "검색어"
        required: false
        default: "seoul city"

permissions:
  contents: read

jobs:
  pixabay-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Search Pixabay videos (key is never printed)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          Q: ${{ inputs.query }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request, urllib.error
          key = os.environ.get("PIXABAY_API_KEY", "").strip()
          if not key:
              sys.exit("PIXABAY_RESULT missing_secret")
          url = "https://pixabay.com/api/videos/?" + urllib.parse.urlencode({"key": key, "q": os.environ["Q"], "per_page": 5, "safesearch": "true"})
          try:
              with urllib.request.urlopen(url, timeout=30) as r:
                  d = json.load(r)
                  limit = r.headers.get("X-RateLimit-Limit")
          except urllib.error.HTTPError as e:
              sys.exit(f"PIXABAY_RESULT http_error {e.code}")
          hits = d.get("hits", [])
          sample = [{"id": h["id"], "user": h.get("user"), "duration": h.get("duration"), "w": h["videos"]["medium"]["width"], "h": h["videos"]["medium"]["height"]} for h in hits[:3]]
          print("PIXABAY_RESULT " + json.dumps({"total": d.get("totalHits"), "rateLimit": limit, "sample": sample}, ensure_ascii=False))
          PY
